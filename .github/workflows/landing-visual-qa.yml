name: Landing Visual QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  landing-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chrome

      - name: Capture landing page
        run: npx playwright test e2e/landing.visual.spec.ts

      - name: Upload landing screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-visual-qa
          path: artifacts/landing
          if-no-files-found: warn
          retention-days: 7
